services:

  # ==================================
  # 1. FRONTEND - REACT + VITE (Static)
  # ==================================

  - type: web
    name: terrax-frontend
    runtime: static

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist

    autoDeployTrigger: commit

    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: terrax-backend
          envVarKey: RENDER_EXTERNAL_URL

      - key: VITE_ML_SERVICE_URL
        fromService:
          type: web
          name: terrax-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html


  # ==================================
  # 2. BACKEND - NODE + EXPRESS
  # ==================================

  - type: web
    name: terrax-backend
    runtime: node
    plan: free
    region: singapore

    rootDir: backend

    buildCommand: npm install
    startCommand: npm start

    healthCheckPath: /api/health

    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: terrax-ml
          envVarKey: RENDER_EXTERNAL_URL

      - key: CORS_ORIGIN
        fromService:
          type: web
          name: terrax-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: WEATHERAPI_KEY
        sync: false

      - key: OPENWEATHERMAP_KEY
        sync: false


  # ==================================
  # 3. ML SERVICE - PYTHON + FASTAPI
  # ==================================

  - type: web
    name: terrax-ml
    runtime: python
    plan: free
    region: singapore

    rootDir: geo-ml-service

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    autoDeployTrigger: commit

    envVars:
      - key: APP_ENV
        value: production

      - key: PYTHON_VERSION
        value: 3.12.8

      - key: LOG_LEVEL
        value: info

      - key: CORS_ORIGINS
        fromService:
          type: web
          name: terrax-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: OPENTOPOGRAPHY_API_KEY
        sync: false

      - key: COPERNICUS_ACCESS_TOKEN
        sync: false
