services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-earth_geo}
      POSTGRES_USER: ${POSTGRES_USER:-earth_geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      BACKEND_PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
  geo-ml-service:
    build: ./geo-ml-service
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
volumes:
  postgres_data:
